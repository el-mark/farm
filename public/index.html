<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Little Farm</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>🚜 Little Farm</h1>
    <div class="stats">
      <div id="gold">Gold: 0</div>
      <div id="points">Points: 0 / 0</div>
    </div>
  </header>

  <main>
    <div id="grid"></div>
    <p id="message"></p>
  </main>

  <div id="win-overlay" hidden>
    <div class="win-card">
      <h2>🏆 You reached the goal!</h2>
      <p id="win-text"></p>
      <button id="restart-btn">Restart</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
